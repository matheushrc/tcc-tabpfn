title_en=Evaluation of TabPFN for mineral occurrence prediction and chemical composition prediction from satellite spectral data
keywords_pt=TabPFN; sensoriamento remoto; Sentinel-2; ocorrências minerais; composição química
keywords_en=TabPFN; remote sensing; Sentinel-2; mineral occurrences; chemical composition
abstract_pt=O mapeamento geológico do Brasil ainda é incompleto, e a prospecção mineral tradicional depende de levantamentos de campo e análises laboratoriais demorados e custosos. Dados espectrais de satélite permitem observar grandes áreas e podem apoiar a seleção de locais para investigação. Este trabalho propõe avaliar o TabPFN, um foundation model para dados tabulares pré-treinado com conjuntos sintéticos, na previsão de ocorrências minerais e na predição da composição química a partir de dados espectrais de satélite. Para isso, será construído um conjunto de dados que associa a substância registrada nos processos minerários ativos da Agência Nacional de Mineração (ANM) e as referências geológicas e geoquímicas do Serviço Geológico do Brasil (SGB) aos valores de reflectância de imagens Sentinel-2 de nível 2A. Na previsão de ocorrências, um único modelo de classificação atribuirá probabilidades às substâncias; na predição da composição química, condicionada à disponibilidade de referências adequadas, será ajustado um modelo de regressão para cada elemento. O TabPFN será comparado a modelos utilizados nos trabalhos relacionados, como Random Forest e XGBoost, por meio de validação cruzada por blocos espaciais em todo o Brasil e de métricas de classificação e de regressão. Um estudo de ablação verificará a contribuição de cada grupo de atributos. Os conjuntos derivados cuja redistribuição for permitida serão disponibilizados no Kaggle. Espera-se verificar se a abordagem pode apoiar a triagem inicial de áreas para investigação, sem substituir a confirmação geológica em campo.
abstract_en=Geological mapping in Brazil is still incomplete, and traditional mineral prospecting depends on field surveys and laboratory analyses that are slow and costly. Satellite spectral data cover large areas and can support the selection of sites for investigation. This work proposes to evaluate TabPFN, a foundation model for tabular data pretrained on synthetic datasets, for mineral occurrence prediction and chemical composition prediction from satellite spectral data. To this end, a dataset will be built that links the substance recorded in the active mining processes of the National Mining Agency (ANM) and the geological and geochemical references of the Geological Survey of Brazil (SGB) to reflectance values from Sentinel-2 Level-2A images. For occurrence prediction, a single classification model will assign probabilities to the substances; for chemical composition prediction, conditional on the availability of suitable references, one regression model will be fitted for each element. TabPFN will be compared with models used in related works, such as Random Forest and XGBoost, through spatial block cross-validation across Brazil and classification and regression metrics. An ablation study will assess the contribution of each group of features. The derived datasets whose redistribution is permitted will be made available on Kaggle. The work aims to verify whether this approach can support the initial screening of areas for investigation, without replacing geological confirmation in the field.

